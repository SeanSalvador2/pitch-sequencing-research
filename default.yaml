# Shared configuration for the pitch-sequencing study. See SPEC.md for rationale.

data:
  db_path: data/raw/statcast.db          # combined SQLite (table `statcast`)
  parquet_glob: data/raw/statcast_*.parquet
  seasons: [2021, 2022, 2023, 2024, 2025]
  game_types: ["R"]                       # regular season for the main analysis

# pitch_type -> family. 'XX' is descriptive-only, excluded from recommendations.
pitch_families:
  FF: [FF]                                # four-seam
  SI: [SI, FT]                            # sinker / two-seam
  FC: [FC]                                # cutter
  SL: [SL, ST, SV]                        # slider / sweeper / slurve
  CU: [CU, KC, CS]                        # curve / knuckle-curve / slow curve
  CH: [CH]                                # changeup
  FS: [FS, FO]                            # splitter / forkball
  XX: [KN, EP, SC, FA, PO, null]          # knuckle/eephus/screwball/other/unknown

action:
  primary: family                         # {family, pitch_type}; family is primary
  feasible_mask:
    min_count: 50                         # >= 50 thrown ...
    min_share: 0.03                       # ... AND >= 3% ...
    window: trailing_season               # ... over a trailing window ending pre-game

reward:
  field: delta_run_exp
  sign: negate                            # R = -delta_run_exp (larger better for pitcher)
  sign_check: true                        # assert R>0 on K/whiff/out, R<0 on BB/HR

state_views: [C, U, L1, O, OM]            # the nested measurement ladder

rolling:
  window: trailing_season                 # leakage-safe: strictly before current game
  min_history_pitches: 100                # below this a pitcher is "low-history"

split:
  train:  [2021, 2022, 2023]
  val:    [2024]
  test:   [2025]                          # locked
  rolling_replications:
    - {train: [2021, 2022], val: [2023], test: [2024]}
    - {train: [2021, 2022, 2023], val: [2024], test: [2025]}
  cluster: pitcher_game                   # unit for bootstrap CIs

report_slices:                            # sequence metrics reported separately for each
  - all
  - seq_eligible          # pitch_number >= 2
  - long_pa               # pitch_number >= 3
  - two_strike
  - three_ball
  - first_pitch           # only matchup memory can matter

ope:
  estimators: [DM, IPS, SNIPS, DR, stepwise_DR, FQE]
  conservative_alpha: [0.0, 0.1, 0.25, 0.5, 1.0]   # pi_alpha mixing with behavior
  weight_clip: true
  report: [value, lower_95, ess, oos_support_frac, max_weight, kl_from_behavior, tv_from_behavior]
  inconclusive_if_estimators_disagree: true

seeds:
  global: 20260713
