[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchseq"
version = "0.1.0"
description = "Shared foundation (Workstream 0) for the pitch-sequencing comparative study"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sean Salvador" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "matplotlib>=3.8",  # figures: the WS7 frontier and all notebook plots
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ml = ["lightgbm>=4.0"]
deep = ["torch>=2.0"]  # WS6 deep sequence models (GRU / compact Transformer demo); CPU or CUDA

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pitchseq = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
